[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-t4"
version = "0.3.0"
description = "Browserless Google Colab T4 lifecycle manager with Tailscale SSH and OpenAI-compatible inference"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
colab-t4 = "colab_t4.cli:main"

[tool.setuptools]
packages = ["colab_t4"]
